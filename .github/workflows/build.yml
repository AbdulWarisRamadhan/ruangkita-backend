
name: Build RuangKita Backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Resolve dependencies
        run: go mod tidy

      - name: Test Go package
        run: go test ./...

      - name: Build backend
        run: go build -v -o ruangkita-backend .
